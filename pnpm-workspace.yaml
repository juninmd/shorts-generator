packages:
  - web

minimumReleaseAge: 1440

minimumReleaseAgeExclude:
  - "ai"
  - "@ai-sdk/*"
  - "dotenv"
  - "vite"
  - "@vitejs/*"
  - "@rolldown/*"
  - "rolldown"
  - "google-auth-library"
  - "google-logging-utils"

onlyBuiltDependencies:
  - esbuild
  - better-sqlite3
  - msgpackr-extract
  - sqlite3

allowBuilds:
  better-sqlite3: true
  esbuild: true
  msgpackr-extract: true
  sqlite3: true
