<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
    <dir>C:\Windows\Fonts</dir>
    <dir>/usr/share/fonts</dir>
    <dir>/usr/local/share/fonts</dir>
    <dir>~/.fonts</dir>
    <dir>assets/fonts</dir>
    <cachedir>~/.cache/fontconfig</cachedir>
    <config>
        <rescan>
            <int>30</int>
        </rescan>
    </config>
</fontconfig>
