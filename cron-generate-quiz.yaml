# Steadily produces quiz shorts to keep the upload queue / PVC stocked, so the
# every-30-min queue-drip CronJob always has at least one short to publish per
# hour. Quiz generation is self-contained (no download / Whisper), so it is
# cheap to run on a schedule. Clips blocked by rate limits accumulate on the PVC
# via the BullMQ queue and are retried by the drip job.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: generate-quiz-job
  namespace: shorts-generator
spec:
  schedule: "0 */2 * * *"  # every 2 hours
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          containers:
          - name: generate-quiz
            image: ghcr.io/juninmd/shorts-generator:latest
            imagePullPolicy: Always
            command: ["pnpm", "run", "cli"]
            args: ["--", "generate:quiz", "--managed-channel", "akitemquiz"]
            volumeMounts:
            - name: output-storage
              mountPath: /app/output
            env:
            - name: OUTPUT_DIR
              value: "/app/output"
            - name: ENABLE_YOUTUBE
              value: "true"
            - name: YOUTUBE_NO_COOKIES
              value: "true"
            - name: REDIS_URL
              value: "redis://redis.databases.svc.cluster.local:6379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: REDIS_PASSWORD
                  name: redis-secret
                  optional: false
            - name: AI_MODEL
              value: cloud/gemma3
            - name: LITELLM_BASE_URL
              value: http://litellm.ai.svc.cluster.local:4000/v1
            - name: LITELLM_KEY
              valueFrom:
                secretKeyRef:
                  key: LITELLM_KEY
                  name: shorts-generator-secret
            - name: CONTROL_PLANE_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  key: CONTROL_PLANE_ENCRYPTION_KEY
                  name: shorts-generator-secret
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  key: TELEGRAM_BOT_TOKEN
                  name: shorts-generator-secret
            - name: TELEGRAM_CHAT_ID
              valueFrom:
                secretKeyRef:
                  key: TELEGRAM_CHAT_ID
                  name: shorts-generator-secret
            - name: ADMIN_API_TOKEN
              valueFrom:
                secretKeyRef:
                  key: ADMIN_API_TOKEN
                  name: shorts-generator-secret
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  key: DATABASE_URL
                  name: shorts-generator-secret
            resources:
              limits:
                cpu: "1"
                memory: 2Gi
              requests:
                cpu: 10m
                memory: 512Mi
          restartPolicy: Never
          volumes:
          - name: output-storage
            persistentVolumeClaim:
              claimName: shorts-output-pvc
          imagePullSecrets:
          - name: ghcr-pull-secret
