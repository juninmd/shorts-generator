name: Generate Top Shorts

on:
  schedule:
    # Runs at 18:00 BRT (21:00 UTC)
    - cron: "0 21 * * *"
  workflow_dispatch:

env:
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  YOUTUBE_CHANNELS: ${{ vars.YOUTUBE_CHANNELS }}
  OLLAMA_MODEL: ${{ vars.OLLAMA_MODEL || 'gemma3:1b' }}
  WHISPER_MODEL: ${{ vars.WHISPER_MODEL || 'base' }}
  WHISPER_USE_GPU: "false"
  ENABLE_YOUTUBE: "true"
  OLLAMA_TIMEOUT_MS: 300000
  VIDEO_LIMIT: "1"
  OUTPUT_DIR: ./output
  OLLAMA_MODELS_DIR: ~/.ollama/models
  YOUTUBE_COOKIES_BASE64: ${{ secrets.YOUTUBE_COOKIES_BASE64 }}
  YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
  YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
  YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
  WATERMARK_TEXT: ${{ vars.WATERMARK_TEXT }}
  MAX_VIDEO_SIZE_MB: ${{ vars.MAX_VIDEO_SIZE_MB || '500' }}
  MIN_SHORTS_PER_VIDEO: ${{ vars.MIN_SHORTS_PER_VIDEO || '2' }}

permissions:
  contents: write

jobs:
  generate-top:
    name: Generate Top YouTube Shorts
    runs-on: ubuntu-latest
    timeout-minutes: 720

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Cache uv virtual environment keyed on pyproject.toml hash
      - name: Cache uv environment
        id: uv-cache
        uses: actions/cache@v4
        with:
          path: tests/yt-download/.venv
          key: ${{ runner.os }}-uv-venv-${{ hashFiles('tests/yt-download/pyproject.toml') }}

      - name: Install Python dependencies
        if: steps.uv-cache.outputs.cache-hit != 'true'
        run: uv pip install --system -r tests/yt-download/pyproject.toml

      # faster-whisper stores models in ~/.cache/huggingface/hub/
      - name: Cache faster-whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: ${{ runner.os }}-faster-whisper-${{ env.WHISPER_MODEL }}
          restore-keys: |
            ${{ runner.os }}-faster-whisper-

      # Cache Ollama model weights — keyed on model name
      - name: Cache Ollama models
        id: ollama-cache
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ${{ env.OLLAMA_MODELS_DIR }}
          key: ${{ runner.os }}-ollama-${{ env.OLLAMA_MODEL }}
          restore-keys: |
            ${{ runner.os }}-ollama-

      # Cache Ollama binary to avoid re-downloading ~100MB every run
      - name: Cache Ollama binary
        id: ollama-bin-cache
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/ollama
          key: ${{ runner.os }}-ollama-bin-v1

      - name: Install Ollama
        if: steps.ollama-bin-cache.outputs.cache-hit != 'true'
        run: curl -fsSL https://ollama.com/install.sh | sh

      # Static ffmpeg with built-in caching — avoids shared-library issues
      - name: Install ffmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          ffmpeg-version: release

      - name: Start Ollama service
        run: |
          ollama serve &
          # Wait until Ollama is ready (up to 30s)
          for i in $(seq 1 30); do
            curl -sf http://localhost:11434/api/tags > /dev/null 2>&1 && break
            sleep 1
          done

      - name: Pull Ollama model (if not cached)
        if: steps.ollama-cache.outputs.cache-hit != 'true'
        run: ollama pull ${{ env.OLLAMA_MODEL }}

      - name: Verify tools
        run: |
          node --version
          ffmpeg -version | head -1
          yt-dlp --version
          ollama --version
          ollama list

      - name: Run top shorts generation
        run: pnpm run generate:top

      - name: Commit posted top videos
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update posted top videos list"
          file_pattern: "posted_top_videos.json"

      - name: Upload generated shorts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: top-shorts-${{ github.run_id }}
          path: output/**/*.mp4
          retention-days: 7
          if-no-files-found: ignore

      - name: Cleanup
        if: always()
        run: rm -rf output/temp
