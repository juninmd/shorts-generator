name: YouTube Download Health Check

on:
  schedule:
    # Every 6 hours to catch YouTube blocking issues early
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'src/core/youtube.ts'
      - '.github/workflows/youtube-health-check.yml'

jobs:
  youtube-health-check:
    name: Verify YouTube Access & Download Capability
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg yt-dlp
          echo "yt-dlp --version: $(yt-dlp --version)"
          echo "ffmpeg -version: $(ffmpeg -version | head -1)"

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Run YouTube health check
        run: npm run test:youtube-health || true
        env:
          YOUTUBE_PLAYER_CLIENT: web
          # No cookies for public videos (we test with Big Buck Bunny)
          SKIP_VIDEO_SIZE_CHECK: 'true'

      - name: Verify yt-dlp can reach YouTube
        run: |
          echo "Testing yt-dlp access to YouTube..."
          yt-dlp \
            --no-check-certificates \
            --js-runtimes node \
            --list-formats \
            --no-warnings \
            --socket-timeout 30 \
            -- "https://www.youtube.com/watch?v=aqz-KE-bpKQ" > /tmp/yt-formats.txt 2>&1

          if grep -q "ID\|EXT" /tmp/yt-formats.txt; then
            echo "✓ yt-dlp can access YouTube and fetch formats"
          else
            echo "✗ yt-dlp CANNOT fetch YouTube formats"
            cat /tmp/yt-formats.txt
            exit 1
          fi

      - name: Check for YouTube bot detection patterns
        run: |
          if grep -i "sign in\|confirm your age\|403\|forbidden" /tmp/yt-formats.txt; then
            echo "⚠️  WARNING: YouTube may be blocking this IP or requires auth"
            exit 1
          fi

      - name: Report health status
        if: always()
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const core = require('@actions/core');

            const formatOutput = fs.existsSync('/tmp/yt-formats.txt')
              ? fs.readFileSync('/tmp/yt-formats.txt', 'utf8').slice(0, 500)
              : 'No output captured';

            core.summary
              .addHeading('YouTube Health Check Report', 2)
              .addRaw(`
            | Check | Status |
            |-------|--------|
            | yt-dlp installed | ✓ |
            | ffmpeg installed | ✓ |
            | YouTube access | ${formatOutput.includes('ID') ? '✓' : '✗'} |
            `)
              .write();

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🚨 YouTube health check FAILED. Downloads may not work. Check workflow logs.'
            })
