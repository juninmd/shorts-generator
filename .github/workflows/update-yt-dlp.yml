name: Daily Dependencies Update

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Update yt-dlp version in pyproject.toml
        run: |
          LATEST_VERSION=$(curl -s https://pypi.org/pypi/yt-dlp/json | jq -r '.info.version')
          echo "Latest yt-dlp version: $LATEST_VERSION"
          sed -i "s/\"yt-dlp>=.*\"/\"yt-dlp>=$LATEST_VERSION\"/" tests/yt-download/pyproject.toml

      - name: Update uv lockfile
        run: |
          cd tests/yt-download
          uv lock

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: daily update of yt-dlp dependency"
          file_pattern: "tests/yt-download/pyproject.toml tests/yt-download/uv.lock"
