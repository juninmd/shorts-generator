name: PR Validation

on:
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  test:
    name: Run Tests & Validate YouTube Download
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install system dependencies & Python packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          uv pip install --system -r tests/yt-download/pyproject.toml pytest

      - name: Verify tools
        run: |
          node --version
          ffmpeg -version | head -1
          yt-dlp --version
          pytest --version

      - name: Run unit tests with coverage
        run: pnpm vitest run --coverage

      - name: Create empty cookies file for tests
        run: touch cookies.txt

      - name: Run YouTube download validation test
        run: pytest tests/yt-download/test_youtube_download.py

      - name: Run Vitest E2E test
        run: pnpm vitest run tests/core/e2e-youtube-download.test.ts
        env:
          GITHUB_ACTIONS: true
