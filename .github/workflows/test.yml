name: PR Validation

on:
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  test:
    name: Run Tests & Validate YouTube Download
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Install system dependencies (ffmpeg and yt-dlp)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          sudo curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp

      - name: Verify tools
        run: |
          node --version
          ffmpeg -version | head -1
          yt-dlp --version

      - name: Run unit tests with coverage
        run: pnpm vitest run --coverage

      - name: Create empty cookies file for tests
        run: touch cookies.txt

      - name: Run Vitest E2E test
        run: pnpm vitest run tests/core/e2e-youtube-download.test.ts
        env:
          GITHUB_ACTIONS: true
