name: WorldCup Tracker Image

on:
  push:
    branches: [master, main]
    paths:
      - 'worldcup-tracker/**'
      - '.github/workflows/worldcup-tracker.yml'
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./worldcup-tracker
          file: ./worldcup-tracker/Dockerfile
          push: true
          tags: |
            ghcr.io/juninmd/worldcup-tracker:latest
            ghcr.io/juninmd/worldcup-tracker:${{ github.sha }}
