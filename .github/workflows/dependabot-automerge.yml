name: Dependabot auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge minor/patch once required checks pass
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        run: |
          for attempt in {1..20}; do
            set +e
            gh pr checks "$PR_URL" --watch --interval 30
            code=$?
            set -e
            if [ "$code" -eq 0 ]; then
              gh pr merge --squash "$PR_URL"
              exit 0
            fi
            if [ "$code" -ne 8 ]; then
              echo "::error::Required checks did not pass (gh exit $code)"
              exit "$code"
            fi
            echo "No checks reported yet (attempt $attempt), retrying in 15s..."
            sleep 15
          done
          echo "::error::No checks reported on the pull request"
          exit 1
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
