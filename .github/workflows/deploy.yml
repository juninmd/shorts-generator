name: CI/CD Pipeline (Build & Deploy)

on:
  push:
    branches:
      - master

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.prep.outputs.tag }}
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Prepare Image Tag
        id: prep
        run: echo "tag=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.prep.outputs.tag }}
            ghcr.io/${{ github.repository }}:latest

  update-gitops:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout app-charts repo
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/app-charts
          token: ${{ secrets.GH_PAT }}
          path: app-charts

      - name: Update Deployment Image Tag
        run: |
          sed -i "s|image: ghcr.io/${{ github.repository }}:.*|image: ghcr.io/${{ github.repository }}:${{ needs.build-and-push.outputs.image_tag }}|g" app-charts/shorts-generator/deployment.yaml

      - name: Commit and Push Changes
        run: |
          cd app-charts
          git config user.name "GitHub Action"
          git config user.email "actions@github.com"
          git add shorts-generator/deployment.yaml
          git commit -m "🚀 Deploy: Update shorts-generator image to ${{ needs.build-and-push.outputs.image_tag }}"
          git push
