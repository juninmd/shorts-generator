name: Generate Shorts

on:
  schedule:
    # Runs at 12:00 BRT (15:00 UTC)
    - cron: "0 15 * * *"
  workflow_dispatch:
    inputs:
      video_urls:
        description: "Comma-separated YouTube video URLs (optional, overrides channel scan)"
        required: false
        type: string
      video_limit:
        description: "Number of videos to fetch per channel"
        required: false
        default: "3"
        type: string
      channels:
        description: "Comma-separated channel handles (optional, overrides env var)"
        required: false
        type: string
      watermark_text:
        description: "Watermark text for generated shorts"
        required: false
        default: "santidade católica"
        type: string

# Prevent multiple simultaneous runs across all workflows
concurrency:
  group: shorts-generation-lock
  cancel-in-progress: false

env:
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  YOUTUBE_CHANNELS: ${{ vars.YOUTUBE_CHANNELS }}
  AI_PROVIDER: openrouter
  AI_MODEL: google/gemini-2.0-flash-lite-001
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  WHISPER_MODEL: ${{ vars.WHISPER_MODEL || 'tiny' }}
  WHISPER_USE_GPU: "false"
  ENABLE_YOUTUBE: "true"
  VIDEO_LIMIT: ${{ inputs.video_limit || vars.VIDEO_LIMIT || '1' }}
  VIDEO_URLS: ${{ inputs.video_urls || '' }}
  OUTPUT_DIR: ./output
  YOUTUBE_COOKIES_BASE64: ${{ secrets.YOUTUBE_COOKIES_BASE64 }}
  YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
  YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
  YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
  WATERMARK_TEXT: ${{ inputs.watermark_text || vars.WATERMARK_TEXT }}
  MAX_VIDEO_SIZE_MB: ${{ vars.MAX_VIDEO_SIZE_MB || '500' }}
  MIN_SHORTS_PER_VIDEO: ${{ vars.MIN_SHORTS_PER_VIDEO || '2' }}

jobs:
  generate:
    name: Generate YouTube Shorts
    runs-on: ubuntu-latest
    timeout-minutes: 720

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # Cache uv virtual environment keyed on pyproject.toml hash
      - name: Cache uv environment
        id: uv-cache
        uses: actions/cache@v5
        with:
          path: tests/yt-download/.venv
          key: ${{ runner.os }}-uv-venv-v2-${{ hashFiles('tests/yt-download/pyproject.toml') }}

      - name: Install Python dependencies
        if: steps.uv-cache.outputs.cache-hit != 'true'
        run: |
          uv venv tests/yt-download/.venv
          uv pip install -r tests/yt-download/pyproject.toml --python tests/yt-download/.venv

      - name: Add local bin to PATH
        run: |
          echo "$GITHUB_WORKSPACE/tests/yt-download/.venv/bin" >> $GITHUB_PATH
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      # faster-whisper stores models in ~/.cache/huggingface/hub/
      - name: Cache faster-whisper model
        uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface/hub
          key: ${{ runner.os }}-faster-whisper-${{ env.WHISPER_MODEL }}
          restore-keys: |
            ${{ runner.os }}-faster-whisper-

      # Static ffmpeg with built-in caching — avoids shared-library issues
      - name: Install ffmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          ffmpeg-version: release

      - name: Verify tools
        run: |
          node --version
          ffmpeg -version | head -1
          yt-dlp --version

      - name: Override channels (if provided)
        if: ${{ inputs.channels }}
        run: echo "YOUTUBE_CHANNELS=$INPUT_CHANNELS" >> $GITHUB_ENV
        env:
          INPUT_CHANNELS: ${{ inputs.channels }}

      - name: Run shorts generation
        run: pnpm run generate

      - name: Upload generated shorts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: shorts-${{ github.run_id }}
          path: output/**/*.mp4
          retention-days: 7
          if-no-files-found: ignore

      - name: Cleanup
        if: always()
        run: rm -rf output/temp
