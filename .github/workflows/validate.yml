name: Validate

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check tracked secret files
        shell: bash
        run: |
          forbidden=$(git ls-files | grep -E '(^|/)\.env$|(^|/)\.env\.(local|production|prod|staging|dev)$|(^|/)id_rsa$|(^|/).+\.pem$|(^|/).+\.key$' || true)
          if [ -n "$forbidden" ]; then
            echo "::error::Secret files tracked: $forbidden"
            exit 1
          fi
          echo "No committed secrets found."

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install yt-dlp
        run: |
          base=https://github.com/yt-dlp/yt-dlp/releases/latest/download
          curl -fsSL --retry 5 --retry-connrefused "$base/yt-dlp" -o yt-dlp
          curl -fsSL --retry 5 --retry-connrefused "$base/SHA2-256SUMS" | grep ' yt-dlp$' | sha256sum -c -
          sudo install -m 755 yt-dlp /usr/local/bin/yt-dlp

      - name: Build
        run: bun run build

      - name: Test (Bun runtime)
        run: bun run test

      - name: Test (with coverage gate, Node runtime)
        run: bun run test:coverage
