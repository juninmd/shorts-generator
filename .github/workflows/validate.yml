name: Validate

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check tracked secret files
        shell: bash
        run: |
          forbidden=$(git ls-files | grep -E '(^|/)\.env$|(^|/)\.env\.(local|production|prod|staging|dev)$|(^|/)id_rsa$|(^|/).+\.pem$|(^|/).+\.key$' || true)
          if [ -n "$forbidden" ]; then
            echo "::error::Secret files tracked: $forbidden"
            exit 1
          fi
          echo "No committed secrets found."

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install yt-dlp
        run: |
          base=https://github.com/yt-dlp/yt-dlp/releases/latest/download
          curl -fsSL "$base/yt-dlp" -o yt-dlp
          curl -fsSL "$base/SHA2-256SUMS" | grep ' yt-dlp$' | sha256sum -c -
          sudo install -m 755 yt-dlp /usr/local/bin/yt-dlp

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Build
        run: pnpm run build

      - name: Test (with coverage gate)
        run: pnpm test:coverage
